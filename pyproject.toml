[project]
name = "robodata-workbench"
version = "0.4.0"
description = "具身数据质检工作台：公开机器人演示数据的可追溯检查与浏览"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.45,<2", "plotly>=6,<8", "numpy>=2,<3", "pandas>=2.2,<4",
  "pyarrow>=20,<26", "av>=14,<19", "requests>=2.32,<3", "pillow>=11,<13"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
robodata = "robodata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robodata", "robodata_business"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
