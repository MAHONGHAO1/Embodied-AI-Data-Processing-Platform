[project]
name = "robodata-workbench"
version = "0.17.0"
description = "具身数据质检工作台：公开机器人演示数据的可追溯检查与浏览"
requires-python = ">=3.12,<3.13"
dependencies = [
  "streamlit>=1.45,<2", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1",
  "plotly>=6,<8", "numpy>=2,<3", "pandas>=2.2,<4",
  "pyarrow>=20,<26", "av>=14,<20", "requests>=2.32,<3", "pillow>=11,<13"
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["docs/history", "tools/conversion/.venv"]

[tool.ruff.lint]
# Start with pyflakes (undefined names, unused variables, redefinitions) so the
# gate is meaningful without a 300-file import-sorting diff. Widen to I/UP/B in
# a dedicated cleanup PR.
select = ["E9", "F"]
ignore = ["F401"]  # re-exports and side-effect imports

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]  # a few tests intentionally shadow fixture imports

[project.scripts]
robodata = "robodata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robodata", "robodata_business"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
