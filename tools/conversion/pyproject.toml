[project]
name = "robodata-conversion"
version = "0.4.0"
description = "Isolated Windows CPU environment for LeRobot conversion and loader verification"
requires-python = ">=3.12,<3.13"
dependencies = [
  "lerobot==0.4.4",
  "torch==2.7.1+cpu",
  "torchvision==0.22.1+cpu",
  "av==15.1.0",
  "h5py==3.14.0",
  "numpy==2.2.6",
  "datasets==4.1.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
