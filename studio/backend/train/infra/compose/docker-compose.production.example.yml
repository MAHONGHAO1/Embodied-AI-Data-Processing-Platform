services:
  api:
    environment:
      QUICTRAIN_PROVIDER: aliyun_dlc
      QUICTRAIN_AUTH_MODE: ${QUICTRAIN_AUTH_MODE:-bootstrap}
      ALIYUN_REGION_ID: ${ALIYUN_REGION_ID}
      ALIYUN_DLC_WORKSPACE_ID: ${ALIYUN_DLC_WORKSPACE_ID}
      ALIYUN_DLC_RESOURCE_ID: ${ALIYUN_DLC_RESOURCE_ID}
      ALIYUN_DLC_ECS_SPEC: ${ALIYUN_DLC_ECS_SPEC}
      ALIYUN_DLC_GPU_TYPE: ${ALIYUN_DLC_GPU_TYPE:-}
      ALIYUN_DLC_JOB_MAX_RUNNING_TIME_MINUTES: ${ALIYUN_DLC_JOB_MAX_RUNNING_TIME_MINUTES:-60}
      ALIYUN_DLC_PRIORITY: ${ALIYUN_DLC_PRIORITY:-1}
      ALIYUN_DLC_ACCESSIBILITY: ${ALIYUN_DLC_ACCESSIBILITY:-PUBLIC}
      ALIYUN_DLC_ENDPOINT: ${ALIYUN_DLC_ENDPOINT:-pai-dlc-vpc.cn-beijing.aliyuncs.com}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_RAM_ROLE_ARN: ${ALIYUN_RAM_ROLE_ARN}
      QUICTRAIN_ARTIFACT_ROOT: ${QUICTRAIN_ARTIFACT_ROOT}
      QUICTRAIN_MATERIALIZATION_ROOT: ${QUICTRAIN_MATERIALIZATION_ROOT:-/mnt/cpfs/quictrain/datasets}
      QUICTRAIN_EXPORT_ROOT: ${QUICTRAIN_EXPORT_ROOT:-/mnt/cpfs/quictrain/exports}
      QUICTRAIN_EXPORT_OSS_PREFIX: ${QUICTRAIN_EXPORT_OSS_PREFIX}
      QUICTRAIN_CPFS_DATA_SOURCE_ID: ${QUICTRAIN_CPFS_DATA_SOURCE_ID}
      QUICTRAIN_CPFS_ROOT_URI: ${QUICTRAIN_CPFS_ROOT_URI}
  scheduler:
    environment:
      QUICTRAIN_PROVIDER: aliyun_dlc
      QUICTRAIN_AUTH_MODE: ${QUICTRAIN_AUTH_MODE:-bootstrap}
      ALIYUN_REGION_ID: ${ALIYUN_REGION_ID}
      ALIYUN_DLC_WORKSPACE_ID: ${ALIYUN_DLC_WORKSPACE_ID}
      ALIYUN_DLC_RESOURCE_ID: ${ALIYUN_DLC_RESOURCE_ID}
      ALIYUN_DLC_ECS_SPEC: ${ALIYUN_DLC_ECS_SPEC}
      ALIYUN_DLC_GPU_TYPE: ${ALIYUN_DLC_GPU_TYPE:-}
      ALIYUN_DLC_JOB_MAX_RUNNING_TIME_MINUTES: ${ALIYUN_DLC_JOB_MAX_RUNNING_TIME_MINUTES:-60}
      ALIYUN_DLC_PRIORITY: ${ALIYUN_DLC_PRIORITY:-1}
      ALIYUN_DLC_ACCESSIBILITY: ${ALIYUN_DLC_ACCESSIBILITY:-PUBLIC}
      ALIYUN_DLC_ENDPOINT: ${ALIYUN_DLC_ENDPOINT:-pai-dlc-vpc.cn-beijing.aliyuncs.com}
      QUICTRAIN_ARTIFACT_ROOT: ${QUICTRAIN_ARTIFACT_ROOT}
      QUICTRAIN_MATERIALIZATION_ROOT: ${QUICTRAIN_MATERIALIZATION_ROOT:-/mnt/cpfs/quictrain/datasets}
      QUICTRAIN_EXPORT_ROOT: ${QUICTRAIN_EXPORT_ROOT:-/mnt/cpfs/quictrain/exports}
      QUICTRAIN_EXPORT_OSS_PREFIX: ${QUICTRAIN_EXPORT_OSS_PREFIX}
      QUICTRAIN_CPFS_DATA_SOURCE_ID: ${QUICTRAIN_CPFS_DATA_SOURCE_ID}
      QUICTRAIN_CPFS_ROOT_URI: ${QUICTRAIN_CPFS_ROOT_URI}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT}
      ALIYUN_RAM_ROLE_ARN: ${ALIYUN_RAM_ROLE_ARN}
