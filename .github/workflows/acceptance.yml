name: acceptance

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: "Transport endpoint for the pinned sample"
        required: false
        default: "https://huggingface.co"
      run_full:
        description: "Also run the Windows conversion + delivery + video spot-check job"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  source-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Restore pinned sample
        uses: actions/cache@v4
        with:
          path: work/samples/so100-e0-1
          key: so100-e0-1-54141acb
      - name: Fetch and verify pinned sample
        env:
          ENDPOINT: ${{ inputs.endpoint || 'https://huggingface.co' }}
        run: |
          uv run --locked robodata fetch-sample \
            --episodes 0-1 \
            --data-root work/samples/so100-e0-1 \
            --endpoint "$ENDPOINT"
          uv run --locked robodata fetch-sample \
            --verify-only --episodes 0-1 \
            --data-root work/samples/so100-e0-1
      - name: Run source + import + quality + review
        run: |
          uv run --locked python scripts/verify_pipeline.py \
            --sample work/samples/so100-e0-1 \
            --episodes 0-1 \
            --mode source \
            --output work/acceptance/pipeline-source.json
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robodata-acceptance-source
          path: |
            work/acceptance/pipeline-source.json
            work/acceptance/runs/**/reports/**
          if-no-files-found: warn

  linux-conversion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            tools/conversion/uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install locked workbench dependencies
        run: uv sync --locked
      - name: Install isolated conversion environment
        run: uv sync --project tools/conversion --locked
      - name: LeRobot v2.1 converter + registry/queue tests on Linux
        run: |
          uv run --locked python -m pytest -q \
            tests/test_lerobot_v21.py \
            tests/test_jobs.py \
            tests/test_journal.py \
            tests/test_ops.py
      - name: Episode-level preview resume on Linux
        run: |
          tools/conversion/.venv/bin/python scripts/verify_preview_resume.py \
            --output work/linux-preview-resume
      - name: Upload Linux conversion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robodata-linux-conversion
          path: |
            work/linux-preview-resume/report.json
            work/linux-preview-resume/preview/source_manifest.json
          if-no-files-found: warn

  full-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.run_full
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install isolated conversion environment
        run: uv sync --project tools/conversion --locked
      - name: Restore pinned sample
        uses: actions/cache@v4
        with:
          path: work/samples/so100-e0-1
          key: so100-e0-1-54141acb
      - name: Fetch and verify pinned sample
        env:
          ENDPOINT: ${{ inputs.endpoint || 'https://huggingface.co' }}
        run: |
          uv run --locked robodata fetch-sample --episodes 0-1 --data-root work/samples/so100-e0-1 --endpoint "$env:ENDPOINT"
          uv run --locked robodata fetch-sample --verify-only --episodes 0-1 --data-root work/samples/so100-e0-1
      - name: Run full acceptance
        run: |
          uv run --locked python scripts/verify_pipeline.py --sample work/samples/so100-e0-1 --episodes 0-1 --mode full --output work/acceptance/pipeline-full.json
      - name: Verify Matching Cable optional streams
        run: uv run --locked python scripts/verify_matching_optional.py --output work/matching-optional
      - name: Verify episode-level preview resume
        run: tools\conversion\.venv\Scripts\python.exe scripts\verify_preview_resume.py --output work\preview-resume
      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robodata-acceptance-full
          path: |
            work/acceptance/pipeline-full.json
            work/acceptance/runs/**/reports/**
          if-no-files-found: warn

  docker-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: docker build -t robodata-workbench:ci .
      - name: Start container on loopback
        run: docker run -d --name robodata -p 127.0.0.1:8765:8765 robodata-workbench:ci
      - name: Wait for health and page
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/api/health -o /tmp/health.json; then break; fi
            sleep 2
          done
          cat /tmp/health.json
          python - <<'PY'
          import json, tomllib
          value = json.load(open('/tmp/health.json'))
          expected = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert value['status'] == 'ok', value
          assert value['scope'] == 'container', value
          assert value['version'] == expected, (value, expected)
          print('health ok', value)
          PY
          curl -fsS http://127.0.0.1:8765/ | grep -q 'id="root"'
          echo 'frontend shell served'
      - name: Run known-bad fixtures inside the image
        run: docker exec robodata /app/.venv/bin/robodata verify-fixtures
      - name: Start the queue worker once inside the image
        # This proves the worker process and SQLite queue open in the container.
        # It does not claim that the image contains the heavy conversion environment.
        run: docker run --rm robodata-workbench:ci /app/.venv/bin/python -m robodata.worker --once
      - name: Show container logs on failure
        if: failure()
        run: docker logs robodata
      - name: Stop container
        if: always()
        run: docker rm -f robodata || true

