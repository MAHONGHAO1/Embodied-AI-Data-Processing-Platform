name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Ruff
        run: uv run --locked ruff check .

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend unit tests and production build
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Install Chromium for browser tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e

  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run --locked python -m pytest -q
      - name: Verify the known-bad fixtures
        # 判据引擎改坏了，pytest 未必看得出来；这一步直接验六个反例是否仍被拦下。
        run: uv run --locked robodata verify-fixtures
